<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040712"/>
      <stop offset=".55" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#050713"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset=".5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="296" rx="24" fill="none" stroke="url(#neon)" stroke-width="2"/>

  <!-- HUD frame -->
  <path d="M35 82V35h75 M1090 35h75v47 M35 218v47h75 M1090 265h75v-47"
        fill="none" stroke="#00d9ff" stroke-width="3" filter="url(#glow)"/>

  <circle cx="155" cy="150" r="72" fill="none" stroke="#173d83" stroke-width="1"/>
  <circle cx="155" cy="150" r="55" fill="none" stroke="#00d9ff" stroke-width="2" opacity=".8"/>
  <text x="155" y="164" fill="#00d9ff" font-family="Arial,sans-serif"
        font-size="55" font-weight="700" text-anchor="middle">“</text>

  <text x="600" y="92" fill="#7895c9" font-family="Arial,sans-serif"
        font-size="12" text-anchor="middle" letter-spacing="5">AASIF // DEVELOPER LOG</text>

  <text x="600" y="142" fill="#ffffff" font-family="Arial,sans-serif"
        font-size="29" font-weight="700" text-anchor="middle">“TURNING IDEAS INTO REALITY.”</text>

  <line x1="365" y1="166" x2="835" y2="166" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>

  <text x="600" y="202" fill="#9db2df" font-family="Arial,sans-serif"
        font-size="14" text-anchor="middle" letter-spacing="3">CODE • DESIGN • CREATE • EXPLORE</text>

  <text x="600" y="242" fill="#00d9ff" font-family="monospace"
        font-size="12" text-anchor="middle" letter-spacing="2">SYSTEM STATUS: BUILDING THE NEXT IDEA...</text>

  <text x="1040" y="154" fill="#7c5cff" font-family="monospace"
        font-size="11" text-anchor="middle">01</text>
  <text x="1040" y="173" fill="#5f76a8" font-family="monospace"
        font-size="10" text-anchor="middle">VISION</text>
</svg>