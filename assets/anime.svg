<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="55%" stop-color="#0b1029"/>
      <stop offset="100%" stop-color="#19082d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43e8ff"/>
      <stop offset="100%" stop-color="#896fff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#26325b" stroke-width="1" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="648" rx="28" fill="none" stroke="#293662" stroke-width="2"/>
  <rect width="1200" height="650" fill="url(#grid)"/>

  <circle cx="970" cy="180" r="170" fill="#694dff" opacity=".11" filter="url(#blur)"/>
  <circle cx="170" cy="500" r="145" fill="#00dcff" opacity=".07" filter="url(#blur)"/>

  <text x="55" y="58" fill="#7180aa" font-family="monospace" font-size="18" letter-spacing="4">AASIF // CREATIVE_UNIVERSE</text>
  <text x="55" y="88" fill="#dce7ff" font-family="monospace" font-size="13">ANIME • STORYTELLING • WORLDBUILDING • GAME IDEAS</text>

  <!-- portal -->
  <circle cx="925" cy="315" r="145" fill="none" stroke="#1b315e" stroke-width="2"/>
  <circle cx="925" cy="315" r="116" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="925" cy="315" r="78" fill="#11183a" opacity=".9" stroke="#5061a1"/>
  <path d="M850 370 Q925 245 1000 370" fill="none" stroke="#43e8ff" stroke-width="3" opacity=".8"/>
  <path d="M870 365 Q925 280 980 365" fill="none" stroke="#896fff" stroke-width="2" opacity=".9"/>
  <text x="894" y="326" fill="#ffffff" font-family="monospace" font-size="31" filter="url(#glow)">∞</text>
  <text x="862" y="420" fill="#7180aa" font-family="monospace" font-size="12">STORY PORTAL</text>

  <!-- floating shards -->
  <path d="M775 145 l22 -13 12 22 -22 13z" fill="none" stroke="#43e8ff" opacity=".7"/>
  <path d="M1035 185 l18 -9 10 18 -18 9z" fill="none" stroke="#896fff" opacity=".7"/>
  <path d="M1060 455 l24 -14 10 22 -24 14z" fill="none" stroke="#43e8ff" opacity=".6"/>

  <!-- left content -->
  <text x="70" y="155" fill="#43e8ff" font-family="monospace" font-size="14">01 // CREATIVE MODE</text>
  <text x="70" y="198" fill="#ffffff" font-family="monospace" font-size="30">IMAGINATION</text>
  <text x="70" y="235" fill="#ffffff" font-family="monospace" font-size="30">BECOMES A WORLD.</text>

  <text x="70" y="280" fill="#8794bb" font-family="monospace" font-size="14">Original anime concepts</text>
  <text x="70" y="306" fill="#8794bb" font-family="monospace" font-size="14">Characters • clans • powers • lore</text>
  <text x="70" y="332" fill="#8794bb" font-family="monospace" font-size="14">Stories designed for games &amp; animation</text>

  <!-- tags -->
  <rect x="70" y="370" width="115" height="30" rx="15" fill="#101b34" stroke="#294a70"/>
  <text x="91" y="390" fill="#66eaff" font-family="monospace" font-size="11">ANIME</text>
  <rect x="195" y="370" width="125" height="30" rx="15" fill="#101b34" stroke="#294a70"/>
  <text x="215" y="390" fill="#66eaff" font-family="monospace" font-size="11">WORLD LORE</text>
  <rect x="330" y="370" width="125" height="30" rx="15" fill="#15122f" stroke="#514a88"/>
  <text x="350" y="390" fill="#a99cff" font-family="monospace" font-size="11">CHARACTERS</text>

  <!-- creative status -->
  <rect x="70" y="445" width="540" height="112" rx="18" fill="#080d20" stroke="#293761"/>
  <text x="95" y="477" fill="#53628e" font-family="monospace" font-size="12">CURRENT CREATIVE SIGNAL</text>
  <text x="95" y="512" fill="#dce7ff" font-family="monospace" font-size="18">IDEA → CHARACTER → CONFLICT → WORLD</text>
  <line x1="95" y1="530" x2="570" y2="530" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <text x="95" y="550" fill="#8affb7" font-family="monospace" font-size="11">STATUS: IMAGINATION ONLINE</text>

  <text x="55" y="610" fill="#53628e" font-family="monospace" font-size="13">CREATE STORIES. BUILD WORLDS. MAKE THEM PLAYABLE.</text>
  <text x="1018" y="610" fill="#53628e" font-family="monospace" font-size="13">AASIF.EXE</text>
</svg>