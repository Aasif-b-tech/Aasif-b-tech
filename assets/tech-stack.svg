      <text x="42" y="60" fill="#00d9ff" font-size="24" text-anchor="middle">&lt;/&gt;</text>
      <text x="82" y="43" fill="#fff" font-size="18" font-weight="700">WEB DEV</text>
      <text x="82" y="67" fill="#8ea8d9" font-size="12">HTML • CSS • JS</text>
      <text x="82" y="87" fill="#8ea8d9" font-size="12">REACT • NODE</text>
    </g>

    <g transform="translate(325 120)">
