      <text x="42" y="61" fill="#b8a8ff" font-size="25" text-anchor="middle">AI</text>
      <text x="82" y="43" fill="#fff" font-size="18" font-weight="700">AI / DATA</text>
      <text x="82" y="67" fill="#8ea8d9" font-size="12">PYTHON • ML</text>
      <text x="82" y="87" fill="#8ea8d9" font-size="12">EXPERIMENT • BUILD</text>
