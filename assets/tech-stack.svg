<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".5" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#03050f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset=".5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="none" stroke="url(#line)" stroke-width="2" opacity=".8"/>

  <!-- futuristic corner brackets -->
  <path d="M35 90V35h55 M1110 35h55v55 M35 330v55h55 M1110 385h55v-55"
        fill="none" stroke="#00d9ff" stroke-width="3" filter="url(#glow)"/>

  <text x="600" y="58" fill="#ffffff" font-family="Arial, sans-serif"
        font-size="27" font-weight="700" text-anchor="middle" letter-spacing="7">AASIF // TECH CORE</text>
  <text x="600" y="88" fill="#8ea8d9" font-family="Arial, sans-serif"
        font-size="13" text-anchor="middle" letter-spacing="4">TOOLS • TECHNOLOGIES • CREATION</text>

  <!-- cards -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 120)">
      <rect width="250" height="105" rx="16" fill="#08112a" stroke="#167cff" stroke-width="1.5"/>
