      <text x="125" y="64" fill="#00d9ff" font-size="13" text-anchor="middle">LEARNING → BUILDING</text>
      <text x="125" y="84" fill="#8ea8d9" font-size="11" text-anchor="middle" letter-spacing="2">IDEA → PROTOTYPE → REALITY</text>
