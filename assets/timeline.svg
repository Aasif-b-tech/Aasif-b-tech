<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="55%" stop-color="#0a1028"/>
      <stop offset="100%" stop-color="#160a2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43e8ff"/>
      <stop offset="100%" stop-color="#806dff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#25315a" stroke-width="1" opacity=".32"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="618" rx="28" fill="none" stroke="#293662" stroke-width="2"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <circle cx="980" cy="110" r="125" fill="#624cff" opacity=".11" filter="url(#blur)"/>
  <circle cx="160" cy="520" r="135" fill="#00d9ff" opacity=".07" filter="url(#blur)"/>

  <text x="55" y="58" fill="#7180aa" font-family="monospace" font-size="18" letter-spacing="4">AASIF // DEVELOPER_TIMELINE</text>
  <text x="55" y="88" fill="#dce7ff" font-family="monospace" font-size="13">EVOLUTION LOG • BUILDING FOR THE FUTURE</text>
  <circle cx="1110" cy="48" r="7" fill="#45e8ff" filter="url(#glow)"/>
  <text x="1130" y="55" fill="#7180aa" font-family="monospace" font-size="12">LIVE</text>

  <line x1="105" y1="330" x2="1095" y2="330" stroke="#26345e" stroke-width="5"/>
  <line x1="105" y1="330" x2="1095" y2="330" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>

  <!-- 2024 -->
  <circle cx="150" cy="330" r="17" fill="#071024" stroke="#43e8ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="150" cy="330" r="5" fill="#43e8ff"/>
  <rect x="75" y="145" width="150" height="120" rx="16" fill="#080d20" stroke="#26345f"/>
  <text x="95" y="178" fill="#43e8ff" font-family="monospace" font-size="18">2024</text>
  <text x="95" y="207" fill="#dce7ff" font-family="monospace" font-size="15">START</text>
  <text x="95" y="232" fill="#7887b0" font-family="monospace" font-size="13">Learn</text>
  <text x="95" y="252" fill="#7887b0" font-family="monospace" font-size="13">Explore</text>

  <!-- 2025 -->
  <circle cx="395" cy="330" r="17" fill="#071024" stroke="#43e8ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="395" cy="330" r="5" fill="#43e8ff"/>
  <rect x="320" y="385" width="150" height="120" rx="16" fill="#080d20" stroke="#26345f"/>
  <text x="340" y="418" fill="#43e8ff" font-family="monospace" font-size="18">2025</text>
  <text x="340" y="447" fill="#dce7ff" font-family="monospace" font-size="15">BUILD</text>
  <text x="340" y="472" fill="#7887b0" font-family="monospace" font-size="13">Web • UI/UX</text>
  <text x="340" y="492" fill="#7887b0" font-family="monospace" font-size="13">Projects</text>

  <!-- 2026 -->
  <circle cx="640" cy="330" r="21" fill="#071024" stroke="#7d6cff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="640" cy="330" r="7" fill="#7d6cff"/>
  <rect x="565" y="145" width="150" height="120" rx="16" fill="#0b1027" stroke="#514b91" stroke-width="2"/>
  <text x="585" y="178" fill="#8a7cff" font-family="monospace" font-size="18">2026</text>
  <text x="585" y="207" fill="#ffffff" font-family="monospace" font-size="15">CREATE</text>
  <text x="585" y="232" fill="#9da9cf" font-family="monospace" font-size="13">AI • Games</text>
  <text x="585" y="252" fill="#9da9cf" font-family="monospace" font-size="13">Hackathons</text>

  <!-- FUTURE -->
  <circle cx="885" cy="330" r="18" fill="#071024" stroke="#43e8ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="885" cy="330" r="5" fill="#43e8ff"/>
  <rect x="810" y="385" width="150" height="120" rx="16" fill="#080d20" stroke="#26345f"/>
  <text x="830" y="418" fill="#43e8ff" font-family="monospace" font-size="18">NEXT</text>
  <text x="830" y="447" fill="#dce7ff" font-family="monospace" font-size="15">IMPACT</text>
  <text x="830" y="472" fill="#7887b0" font-family="monospace" font-size="13">Ship • Lead</text>
  <text x="830" y="492" fill="#7887b0" font-family="monospace" font-size="13">Innovate</text>

  <!-- infinity -->
  <circle cx="1080" cy="330" r="25" fill="#071024" stroke="#7d6cff" stroke-width="3" filter="url(#glow)"/>
  <text x="1064" y="340" fill="#9b8cff" font-family="monospace" font-size="27">∞</text>

  <text x="75" y="565" fill="#53628e" font-family="monospace" font-size="13">LEARN → BUILD → CREATE → IMPACT → REPEAT</text>
  <text x="1010" y="565" fill="#53628e" font-family="monospace" font-size="13">AASIF.EXE</text>
</svg>