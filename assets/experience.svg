<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06101d"/><stop offset=".58" stop-color="#0b1830"/><stop offset="1" stop-color="#170d2d"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#19e6ff"/><stop offset="1" stop-color="#73f9ff"/></linearGradient>
  <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#875cff"/><stop offset="1" stop-color="#d58cff"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#17395b" opacity=".34"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="614" rx="22" fill="url(#grid)" stroke="#1e456b" stroke-width="2"/>

<g fill="none" stroke="#19e6ff" stroke-width="3">
 <path d="M55 105V55H105"/><path d="M1095 55H1145V105"/>
 <path d="M55 545V595H105"/><path d="M1095 595H1145V545"/>
</g>

<text x="70" y="88" fill="#19e6ff" font-family="monospace" font-size="20" letter-spacing="4">AASIF // EXPERIENCE LOG</text>
<text x="70" y="128" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">BUILDING IN PUBLIC</text>
<text x="70" y="158" fill="#8da8c5" font-family="monospace" font-size="15">PROJECTS • HACKATHONS • COLLABORATION • SHIP</text>

