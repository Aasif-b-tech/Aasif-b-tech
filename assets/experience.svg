<text x="1085" y="425" text-anchor="end" fill="#7593b1" font-family="monospace" font-size="12">EXPERIMENT • DESIGN • BUILD</text>

<!-- event 4 -->
<circle cx="130" cy="495" r="13" fill="#160d2d" stroke="#d58cff" stroke-width="4" filter="url(#glow)"/>
<rect x="175" y="455" width="945" height="82" rx="16" fill="#120e29" stroke="#6545a3" stroke-width="2"/>
<text x="202" y="486" fill="#d58cff" font-family="monospace" font-size="13" letter-spacing="3">04 // NEXT MISSION</text>
<text x="202" y="515" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">TURN BIGGER IDEAS INTO BIGGER SYSTEMS</text>
