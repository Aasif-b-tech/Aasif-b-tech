<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06101d"/><stop offset=".55" stop-color="#0b1830"/><stop offset="1" stop-color="#160d2b"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#19e6ff"/><stop offset="1" stop-color="#70f8ff"/></linearGradient>
  <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#875cff"/><stop offset="1" stop-color="#d58cff"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16385b" opacity=".35"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="664" rx="22" fill="url(#grid)" stroke="#1e456b" stroke-width="2"/>

<g fill="none" stroke="#19e6ff" stroke-width="3">
 <path d="M55 105V55H105"/><path d="M1095 55H1145V105"/>
 <path d="M55 595V645H105"/><path d="M1095 645H1145V595"/>
</g>

