name: Profile Asset Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-profile-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required profile assets
        shell: bash
        run: |
          set -e

          required_files=(
            "assets/profile.png"
            "assets/profile.gif"
            "assets/banner.gif"
            "assets/tech-stack.svg"
            "assets/quote.svg"
            "assets/activity.svg"
            "assets/goals.svg"
          )

          echo "🔎 Checking AASIF profile assets..."

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done

          echo "🚀 All required profile assets are present."
