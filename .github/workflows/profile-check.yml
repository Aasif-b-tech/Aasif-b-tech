name: Profile Asset Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify profile assets
        shell: bash
        run: |
          set -e

          required_files=(
            "assets/profile.png"
            "assets/profile.gif"
            "assets/banner.gif"
            "assets/tech-stack.svg"
            "assets/terminal.svg"
            "assets/quote.svg"
            "assets/activity.svg"
            "assets/goals.svg"
            "assets/contact.svg"
            "assets/stats.svg"
            "assets/timeline.svg"
            "assets/projects.svg"
            "assets/anime.svg"
            "assets/education.svg"
            "assets/skills.svg"
            "assets/experience.svg"
            "assets/certifications.svg"
            "assets/interests.svg"
            "assets/now-playing.svg"
            "assets/footer.svg"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "✓ $file"
            else
              echo "✗ Missing: $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo ""
            echo "Profile asset check failed."
            exit 1
          fi

          echo ""
          echo "✓ All profile assets are present."
